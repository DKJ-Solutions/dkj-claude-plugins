<!doctype html>
<!-- The brand book is a page of this repo's product, so it takes the product's theme: lilac by default, under the shared
     general-pages key, like root.html and the relayed pages. A theme picked on any product page holds here, and the reverse.
     The brand book previews at full width until a viewer picks another width in the settings panel. -->
<html lang="en" data-theme-default="lilac" data-width-default="full" data-theme-key="general-pages">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DKJ Brand Book</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
