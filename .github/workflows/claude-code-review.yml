name: Claude Code Review

# `pull_request`, NOT `pull_request_target` -- keep it that way. GitHub withholds secrets from
# workflows triggered by a fork's pull request, so `secrets.CLAUDE_CODE_OAUTH_TOKEN` is empty there
# and this job fails rather than handing a credential to code from outside the repo. That failure is
# the safe outcome, not a defect to work around: switching to `pull_request_target` to "fix" the red
# check would run the fork's PR with this repo's secrets in scope.

# AND A SECOND SILENCE, ALSO NOT A DEFECT -- measured on PR #968, the one that added the annotation
# further down. A pull request that MODIFIES THIS FILE gets no review at all. The action validates
# that the workflow is byte-identical to the copy on the default branch, and where it is not it logs
#
#   Skipping action due to workflow validation: ... must exist and have identical content to the
#   version on the repository's default branch
#
# and then exits SUCCESSFULLY, in nine seconds. So the check goes GREEN and no review happened --
# the one outcome the diagnostics below cannot reach, because they run only on failure.
#
# It is the same guarantee the `pull_request` choice above buys, applied to the workflow instead of
# to the secrets: a PR must not review itself under rules it has just rewritten. Do not try to
# defeat it. Just know that a change to THIS file is reviewed by people, and that the green tick it
# collects means nothing until the change is on `main`.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # As in claude.yml: `id-token: write` lets the action mint a GitHub App token that upstream
    # documents as Contents/Pull Requests/Issues READ & WRITE. These read-only scopes bound
    # GITHUB_TOKEN, not that token. The single-tool allowlist below is the real boundary here.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        # Pinned by commit SHA rather than the moving `v4` tag -- see claude.yml for the reasoning.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # continue-on-error SINCE #2000, AND IT DOES NOT DECIDE THE CHECK'S COLOUR -- the last step of
        # this job does. All it buys is the CHANCE to decide: without it a failure here reddens the job
        # immediately and nothing downstream can look at WHY. With it, `outcome` still reads 'failure'
        # (that is the difference between `outcome` and `conclusion`), the two diagnostic steps below key
        # on that instead of on `failure()`, and the decision step re-fails the job for every cause
        # except the one Dave exempted. Read it as "defer the verdict", not as "ignore the error".
        continue-on-error: true
        uses: anthropics/claude-code-action@e63208cb983318a44e3f945e959ef894b707dcfa # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NOT PINNED, AND NOT PINNABLE -- checked rather than assumed (August 14, 2026). Both
          # inputs were read in the action's own `action.yml`: `plugin_marketplaces` takes
          # "Git URLs to install from" and `plugins` takes plugin names, and neither description --
          # nor docs/usage.md -- documents a ref, tag or commit syntax. So this marketplace is cloned
          # fresh on every run and tracks whatever its default branch holds at that moment, which is
          # an unpinned third-party dependency inside the CI of a public plugin source.
          #
          # No syntax was invented to close it. The remedy, if this matters more than the review is
          # worth, is to drop the plugin and write the review prompt inline instead -- a decision
          # about whether the dependency earns its place, not a pinning problem with a hidden answer.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Already minimal: one tool, and no file-editing or Bash surface.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # WHY THIS STEP EXISTS -- issue #913. On PR #911 this check failed on both attempts and the log
      # named no reason at all, so the only hypothesis available was a guess about the credential. That
      # silence is not an upstream omission to be reported: the action's `sanitizeSdkOutput`
      # (base-action/src/run-claude-sdk.ts, read at the pinned SHA) prints exactly seven fields of the
      # result message -- type, subtype, is_error, duration_ms, num_turns, total_cost_usd and a COUNT of
      # the permission denials -- suppresses every other message type outright, and drops the two fields
      # that carry the reason: `result` (the error text) and `api_error_status` (429 for a rate limit,
      # 529 for an overload). The one switch it offers is `show_full_output: true`, and that dumps ALL
      # messages including tool results into a public log; upstream's own description of the input warns
      # it may carry secrets. So the choice on offer is not "hidden or visible" but "nothing or
      # everything", and this step takes the third option.
      #
      # WHAT IT READS, AND WHY THAT WORKS ON A FAILED RUN. The `execution_file` output, which upstream
      # sets on the failure path too: `src/entrypoints/run.ts` calls `setExecutionFileOutputIfPresent()`
      # from its catch block, so the output survives the throw that reddens the step above. The file is a
      # JSON ARRAY of SDK messages whose last element is the result -- upstream reads it that way itself
      # in `update-comment-link.ts`, so that is its documented shape rather than a guess about it.
      #
      # WHAT IT PRINTS, AND THE BOUND ON THAT. The structured fields, which are numbers and enums and can
      # carry no content whatsoever, plus `result` truncated. That last one is free text, which is
      # exactly why this step runs ON FAILURE ONLY: on a failed run it holds the error, and on a
      # successful one -- where it would hold review prose about the diff -- this step does not run.
      #
      # WHY THE LOG WAS NOT ENOUGH -- issue #966, and that is what the annotation and the job summary
      # below are for. #913 made the reason AVAILABLE; it did not make it LEGIBLE. The reason sits in the
      # body of this step's log, while the line a reader meets first is the action's own
      # `##[error]Claude result reported subtype success with is_error:true`, which names nothing. On
      # August 27, 2026 that gap cost a full misdiagnosis: #966 was filed against a run whose log already
      # read `api_error_status: 429`, inferred an expired OAuth token instead, and concluded the repair
      # needed a secret rotated. So the annotation and the summary below add no information -- they move
      # it to where the reader lands, which is the annotation list and the run summary page.
      #
      # SAME BOUND AS ABOVE, unchanged by that move. The annotation carries no text this log did not
      # already carry, capped at the FIRST LINE and 300 characters. That one-line cap is not a policy
      # choice: a newline would terminate the annotation command.
      #
      # THE ONE CAUSE ITS LOGS HAVE EVER NAMED: `api_error_status: 429`, with `result` naming a session
      # limit and the UTC time it resets. Stated as a CONDITION rather than a tally, deliberately, and the
      # reason is this comment's own history. It read "on all FOUR of its red runs -- two attempts on
      # August 26 and two on August 27, 2026" until issue #974 read the logs instead: there were THIRTEEN
      # red runs carrying this diagnostic when that issue was filed, and SIXTEEN when it was repaired a
      # day later. Wrong by roughly 3x when typed, and wrong again before anybody could correct it -- a
      # tally of a workflow's red runs, written inside the workflow that produces them, is stale on the
      # next one, which is the lesson CLAUDE.md already records about counting a name inside the document
      # that carries it. So what is stated here is what needs no maintenance: EVERY red run whose log
      # carries this diagnostic has named 429. The count did matter, which is why it is worth this much
      # prose -- four occurrences across two days reads as an oddity, sixteen reads as "most PRs opened in
      # a busy window get no review", which is the actual behaviour.
      #
      # AND ONE RUN IS OUTSIDE THAT SENTENCE RATHER THAN AGAINST IT: 32984348328 (August 26, 2026)
      # reports `conclusion: failure` while its job carries `conclusion: null` and an EMPTY `steps` array,
      # and `--log-failed` returns nothing. The diagnostic never ran there, so nothing can be attributed
      # to it: it is unknown, not a second cause. The conditional above covers that by not reaching it,
      # which an absolute "THE ONE CAUSE" could not.
      #
      # Worth stating plainly, because the mechanism is invisible from the workflow file:
      # `CLAUDE_CODE_OAUTH_TOKEN` is a SUBSCRIPTION credential, so the allowance it draws on is the same
      # one interactive use draws on. A morning of heavy local work starves the review of every PR opened
      # afterwards, and no amount of retrying inside the run helps: it resets on the clock.
      #
      # AND THERE IS MORE THAN ONE CLOCK -- which is the half this comment got wrong until issue #1055.
      # A subscription carries a SESSION window measured in hours AND a WEEKLY cap measured in days, and
      # both arrive here as the same 429 with the same `is_error: true` shape. Nothing in the status
      # separates them; only the `result` string does. On August 28, 2026 this check went red on eight
      # consecutive runs and every one of them read "You've hit your weekly limit ... resets Aug 31, 7am
      # (UTC)" -- a THREE-DAY outage, not the hours-long one a session window produces.
      #
      # That distinction is worth this much prose because it changes what a reader DOES. Told the window
      # is a session, the reasonable move is to wait a while and re-run; on a weekly cap that is three
      # days of waste and every PR opened in between goes unreviewed. So the headline below points at the
      # reason line for WHICH limit it is, and does not name the window itself, because the status it is
      # switching on cannot tell.
      #
      # BUT IT DOES NOT VOUCH FOR THE TIME THAT SENTENCE NAMES -- issue #1112, and the third correction
      # this comment block has taken from a measurement. On August 29, 2026 run 33267175141 failed at
      # 18:02 UTC reading "You've hit your weekly limit ... resets Aug 31, 7am (UTC)", and runs
      # 33268549172 and 33269512129 REVIEWED SUCCESSFULLY at 18:43 and 18:55 the same evening -- roughly
      # 2.5 days before the reset the string had named. Both were real reviews of 1-3 minutes, not the
      # nine-second workflow-validation skip described at the top of this file.
      #
      # WHY THAT CHANGES THE HEADLINE RATHER THAN THE RELAY. Since #1110 `ship-pr` prints this annotation
      # to the operator verbatim, so whatever this sentence claims is what somebody reads as the answer to
      # WHEN WORK RESUMES. The relay is generic on purpose -- it repeats what an author wrote and cannot
      # know which authors are reliable -- so a caveat added there would caveat every workflow in every
      # consuming repo. The over-claim is THIS file's, and it is repaired here.
      #
      # WHAT WAS NOT MEASURED, deliberately left unexplained: WHY it came back early. A rolling rather
      # than calendar weekly window, a separate session window clearing, an account change upstream --
      # all plausible, none checked. So the headline reports the DISCREPANCY and attributes the time to
      # upstream; it does not offer a mechanism, and neither should the next editor without measuring one.
      #
      # THE STANDING RULE THIS LEAVES BEHIND, since #974 (a tally), #1055 (the window), #1112 (the time)
      # and now #1164 (a third KIND of limit) have each corrected a claim written here about upstream
      # behaviour: the headline states only what the STATUS proves, and everything the `result` STRING
      # says is attributed to upstream rather than asserted. The status proves the account is out of
      # quota and that a re-run adds none. It proves nothing at all about when -- or whether -- the
      # quota returns on its own.
      #
      # A THIRD KIND OF 429 -- issue #1164, and why the headline no longer promises the reason names a
      # timescale at all. On August 31, 2026 this check went red on three consecutive runs
      # (33384724875, 33387305049, 33390012681), each `api_error_status: 429` with the result string
      # "You've hit your individual spend limit -- ask your admin to raise it at
      # claude.ai/settings/usage". That is neither window #1055 named: a spend cap does not reset on a
      # clock, an admin or the billing cycle lifts it, so "wait hours" and "wait days" are both the
      # wrong move. #1164 was filed reading the same is_error/$0/sub-second shape as an EXPIRED OAuth
      # token and a recurrence of #966/#942 -- the exact misread #913's diagnostic step exists to catch,
      # and the annotation on all three runs already named the real cause. So the 429 headline now
      # points at the upstream string for WHICH of the three it is (session window, weekly cap, or a
      # spend limit an admin lifts) and asserts none of them itself. What a session CANNOT do from here
      # is raise that limit -- that is an account-settings action, like the rotation #942 turned out not
      # to need.
      #
      # THE CHECK NO LONGER STAYS RED ON A 429 -- Dave, September 14, 2026, on #2000. This block used to
      # argue the opposite, at length: a 429 means this PR got no review, which is exactly what #966
      # wanted not to be silent, so a green check would hide that better than a red one nobody can read.
      # That argument was not wrong about what a red check MEANS. It was wrong about what a red check
      # DOES after the seventh consecutive one.
      #
      # WHAT CHANGED IS THE BASE RATE, WHICH IS A FACT ABOUT THIS REPO RATHER THAN ABOUT THE ARGUMENT.
      # Seven issues have now been filed against this one check going red -- #891, #913, #942, #966,
      # #1055, #1164 and #2000 -- and the sentence #2000 closes with is the finding: "the cost is that
      # every PR carries a red check nobody should act on, which is the failure mode where a genuinely
      # red one stops being noticed." A signal that fires on every pull request is not a signal. The
      # legibility work #913, #966, #1112 and #1245 did was necessary and is untouched; it made the
      # reason readable, and a readable reason nobody can act on is still noise.
      #
      # SO THE DOWNGRADE IS SCOPED TO 429 AND NOTHING ELSE, and the line is drawn where this file's own
      # text already drew it. The 429 headline says "re-running adds none" -- the account is out of
      # quota, and no act available to a reader of this check changes that. Every other failure is
      # something somebody can do something about: a 529 is transient and a re-run genuinely may help
      # (which is why it deliberately stays red, though it is equally "nothing to do with the diff"), an
      # unexpected status is unknown and unknown is not safe to hide, and the pre-SDK class #1245 found
      # was a missing GitHub App install -- a real, actionable setup defect that a green check would have
      # buried. The decision step at the foot of this job is where that split is enforced.
      #
      # WHAT IS DELIBERATELY NOT LOST. The annotation is unchanged: same ::error level, same title, same
      # text, still written on a 429. It renders in the checks UI and in the job summary whatever the
      # job's conclusion is, so the reason a PR went unreviewed is exactly as readable as it was
      # yesterday. What goes away is the red tick beside it -- and with it ship-pr's "a check FAILED but
      # the merge was not blocked" paragraph, which is the line that was printing on every ship.
      #
      # NOT ADDED TO claude.yml, deliberately. The same blindness is there and this same step would
      # cure it, but that workflow answers a human who typed '@claude' and is already reading the thread
      # when it fails. This one runs unattended on every PR, which is what makes its silence expensive.
      - name: Why the review failed
        id: why-failed
        # A broken diagnostic must not become the story. Since #2000 it also must not SILENTLY DECIDE
        # one: this step now supplies the api status the decision step switches on, so a step that dies
        # yields an empty status, and the empty case there is RED. The fail-safe direction is deliberate
        # -- a diagnostic that cannot speak must not be the reason a check went green.
        continue-on-error: true
        # `steps.claude-review.outcome`, NOT `failure()` -- #2000. The step above now carries
        # continue-on-error, so the JOB is not failed at this point and `failure()` is false; `outcome`
        # is the field that still reads 'failure'. Getting this wrong does not error, it silently skips
        # every diagnostic in the job, which is the #966 silence restored by accident.
        if: steps.claude-review.outcome == 'failure' && steps.claude-review.outputs.execution_file != ''
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          jq -r '
            [.[] | select(.type == "result")] | last
            | if . == null then "No result message in the execution log."
              else
                "subtype:          \(.subtype)",
                "is_error:         \(.is_error)",
                "api_error_status: \(.api_error_status // "null")",
                "stop_reason:      \(.stop_reason // "null")",
                "num_turns:        \(.num_turns)",
                "duration_ms:      \(.duration_ms)",
                "total_cost_usd:   \(.total_cost_usd)",
                "denials:          \(.permission_denials | length)",
                "",
                "result (truncated to 2000 characters):",
                ((.result // "<the result message carried no result field>")[0:2000])
              end
          ' "$EXECUTION_FILE"

          # The two fields the headline needs, read back separately: the status decides the
          # WORDING and the result supplies the sentence. Both tolerate a missing result message
          # without a special case -- `last` on an empty array is null and `null | .x` is null in
          # jq, so each falls through to its `//` default and the empty-status branch below reports
          # that silence as the finding.
          #
          # `.[0] // ""` after the split is not belt-and-braces, it is the bug this was written
          # with: jq's `split` on an EMPTY string returns `[]`, not `[""]`, so `[][0]` is null and
          # `-r` prints the literal word "null". Measured against a fixture carrying no `result`
          # field, where the annotation then read "... named no API status. null".
          #
          # THE 300 AND THE RELAY'S 500 BOUND THE SAME STRING, AND THAT IS DELIBERATE RATHER THAN
          # OVERLOOKED -- issue #1116, measured and left standing. Since #1110 `ship-pr` relays this
          # annotation to the operator through `Get-AuthoredFailureNote`, which cuts a message at 500
          # and appends "...". The headline in front of this reason is 296 characters, so the two caps
          # allow an annotation of 597 against a relay that carries 500, and the part the relay drops
          # is the TAIL of the reason -- which is where "resets Aug 31, 7am (UTC)" lives.
          #
          # WHY LOWERING THIS 300 IS NOT THE REPAIR IT LOOKS LIKE, which is the measurement worth
          # leaving behind. 500 - 296 - 1 = 203, so the operator's console shows 203 characters of
          # reason no matter which end owns the cut. Capping here at 203 would hand that reader the
          # SAME 203 characters, drop the "..." that tells them something was removed, and cost the
          # GitHub annotation -- read in the checks UI, where no 500-character bound applies -- up to
          # 97 characters it currently keeps. It was built and withdrawn on exactly that arithmetic.
          # Nothing can raise the console's 203 except changing which END the relay cuts from, and
          # that is the relay's decision to take generically, not this file's to force.
          #
          # AND IT HAS NEVER BITTEN. Sampled across all 45 titled failure annotations this workflow
          # left on August 27-29, 2026: every one a 429, and upstream's `result` first line ran 51 to
          # 55 characters -- "You've hit your weekly limit ... resets Aug 31, 7am (UTC)" and three
          # session-limit variants -- with the longest message actually emitted at 341. The
          # spend-limit string #1164 surfaced on August 31 is the longest reason seen so far at 121,
          # still well under the 204 a reason has to reach before the console relay drops a word.
          # `scripts/tests/pr-issues.tests.ps1` pins both numbers so neither can move without this
          # reasoning being read first.
          #
          # `status` IS SINGLE-LINED AND CAPPED FOR THE SAME REASON `reason` IS CUT -- inbound #1118.
          # It reaches the annotation through the `*)` headline, and `tostring` on a JSON string yields
          # that string verbatim: a command substitution strips TRAILING newlines and keeps internal
          # ones, so a multi-line value would put text at the START of a line, which is where a workflow
          # command counts. That is the forgery the `reason` half is single-lined to prevent, and the
          # two now behave alike. Nothing is lost by capping: the unsanitised value is printed in full
          # by this step's own `jq` diagnostic above, which is plain stdout rather than a command.
          #
          # AND IT DELIBERATELY ASSERTS NOTHING ABOUT UPSTREAM. #1118 offered the alternative of leaving
          # the asymmetry and recording WHY it is safe -- i.e. that `api_error_status` is status-shaped by
          # construction. That sentence is a claim about somebody else's field, this repo has never been
          # able to measure its domain, and the sampling above is 45 observations of one value, not a
          # domain. #1112 is the standing reminder of what such claims cost here, and this shape needs
          # none: whatever the field carries, the annotation renders.

          status=$(jq -r '[.[] | select(.type == "result")] | last | (.api_error_status // "") | tostring | split("\n") | (.[0] // "") | .[0:32]' "$EXECUTION_FILE")
          reason=$(jq -r '[.[] | select(.type == "result")] | last | (.result // "") | split("\n") | (.[0] // "") | .[0:300]' "$EXECUTION_FILE")

          # The annotation TITLE may hold neither a comma nor '::' -- both are annotation-command
          # syntax -- so the short form goes there and the full sentence goes in the message body.
          case "$status" in
            429) short='out of quota -- the review did not run'
                 headline='The review did not run: the CLAUDE_CODE_OAUTH_TOKEN account is out of quota; re-running adds none. The reason below is upstream text and names one of three -- a session window (hours), a weekly cap (days), or a spend limit an admin lifts -- not proof of WHEN (#1112). Nothing to do with the diff.' ;;
            529) short='API overloaded -- the review did not run'
                 headline='The review did not run: the API was overloaded. Nothing to do with this diff.' ;;
            '')  short='the review failed'
                 headline='The review failed and the result message named no API status.' ;;
            # THE FOURTH `short` IS A LITERAL LIKE THE OTHER THREE, and that is what enforces the rule
            # the comment above states rather than restating it (#1118). This branch used to interpolate
            # `$status` into the TITLE -- the one place a comma or a `::` is annotation-command syntax --
            # so the only branch that could not know what it was putting there was the only one putting a
            # variable there. The status itself is not lost: it is in the headline below, in the message
            # body, where punctuation is free, and in the step summary.
            *)   short='the review failed with an unexpected API status'
                 headline="The review failed with API status $status." ;;
          esac

          # `%` is escaped because the runner percent-DECODES a command's data, so an unescaped
          # `%0A` inside `result` would become a newline in the rendered annotation. It cannot forge
          # a second command -- one only counts at the start of a line, and this message is capped
          # to a single line -- but a diagnostic that renders wrong is the exact failure this step
          # exists to prevent.
          # `headline` is escaped alongside it because the `*)` branch interpolates `$status` into it
          # (#1118); for the three literal headlines the substitution is a no-op. `short` needs none --
          # all four are literals now, which is the point of the change above.
          if [ -n "$reason" ]; then
            echo "::error title=claude-review -- ${short}::${headline//%/%25} ${reason//%/%25}"
          else
            echo "::error title=claude-review -- ${short}::${headline//%/%25}"
          fi

          # The reason goes in a blockquote rather than a table cell: it is free text, and a `|` in
          # it would break a table row instead of appearing in one.
          {
            echo "### claude-review: ${short}"
            echo
            echo "$headline"
            echo
            echo "\`api_error_status\`: \`${status:-null}\`"
            echo
            echo "> ${reason:-_the result message carried no result field_}"
            echo
            echo 'The full diagnostic is in the **Why the review failed** step of this job.'
          } >> "$GITHUB_STEP_SUMMARY"

          # THE STATUS, HANDED TO THE DECISION STEP -- #2000. It is the one field that decides whether
          # this check goes red, and it is published here rather than re-read there because this step has
          # already done the work of finding the result message and single-lining the value.
          #
          # SAFE TO WRITE INTO $GITHUB_OUTPUT WITHOUT FURTHER TREATMENT, and the reason is #1118's, not a
          # new argument: `status` was already cut to its FIRST LINE and 32 characters one screen up,
          # precisely because a multi-line value is a forgery surface for anything line-oriented. A
          # workflow-output file is exactly that -- `name=value` per line, with a heredoc form for
          # multi-line values -- so the treatment that protects the annotation protects this too. Nothing
          # is escaped here that is not escaped there, and nothing new is trusted.
          echo "api_status=$status" >> "$GITHUB_OUTPUT"

      # WHY A SECOND DIAGNOSTIC STEP EXISTS -- issue #1245, and it is the COMPLEMENT of the one above
      # rather than a variation on it. That step is gated on `execution_file != ''`, so everything it
      # knows comes from a result message the SDK wrote. When the action fails BEFORE the SDK is
      # reached there is no such file, the step above is SKIPPED, and this workflow writes no titled
      # annotation at all -- which is the one state that defeats the relay built for exactly this
      # reader.
      #
      # THE MECHANISM, MEASURED RATHER THAN INFERRED. Since #1103 `ship-pr` prints what a failing
      # advisory check said about itself, and `Get-AuthoredFailureNote` selects **a failure annotation
      # carrying a TITLE**. That rule is deliberate and documented in the lib: the runner writes its
      # own with an EMPTY title, and its docstring names *"Action failed with error: ..."* as one of
      # them. A pre-SDK failure produces precisely that shape and nothing else, so the operator meets
      # a red tick with no reason -- the #966 silence again, in a class the 429 work never reached.
      #
      # Measured on run 33663986438 (September 2, 2026, PR #1249): step *Run Claude Code Review*
      # `failure`, step *Why the review failed* `skipped`, and the job's three annotations were a
      # Node-20 warning plus two UNTITLED failures -- "Process completed with exit code 1" and
      # "Action failed with error: Claude Code is not installed on this repository". The reason was
      # sitting in the API the whole time, in the one field the relay does not read.
      #
      # AND THE REPAIR GOES HERE, NOT IN THE LIB -- the rule the lens already carries from #1112. The
      # relay is generic on purpose: it repeats what an author wrote and cannot know which authors are
      # reliable, so teaching it to read UNTITLED annotations would relay "Process completed with exit
      # code 1" in every consumer repo, which is the reassuring-looking note that says nothing that
      # `Get-AuthoredFailureNote`'s own asserts exist to prevent. A workflow that wants to be heard
      # writes a title. This one now does.
      #
      # WHAT IT CLAIMS, AND THE BOUND ON THAT -- the standing rule of this file, after #974, #1055,
      # #1112 and #1164 each corrected a sentence written here. It states only what the EMPTY OUTPUT
      # proves: the SDK produced no result, so the failure is in the setup around it and not in the
      # diff, and no `api_error_status` exists to read -- a 429 or 529 arrives WITH a result message
      # and is therefore the other step's business, never this one's. It does NOT name the cause. It
      # cannot: the cause is in the runner's untitled annotation and in the step log, and this step
      # can read neither. Naming today's cause -- the app installation -- would be the #966 mistake
      # with the sign flipped, an assertion the run never proved. The example is cited as an example.
      #
      # NO JOB-SUMMARY DUPLICATE OF THE LOG, unlike the step above, because there is no log to
      # duplicate: nothing was captured, so the summary carries the same sentence and the pointer.
      - name: Why the review never started
        # Same reasoning as the step above: a broken diagnostic must not become the story.
        continue-on-error: true
        # Same `outcome` reading as the step above, and for the same reason (#2000). This branch needs no
        # status output: it IS the no-status case, and the decision step's empty branch is red, which is
        # the right verdict for a setup failure somebody has to act on.
        if: steps.claude-review.outcome == 'failure' && steps.claude-review.outputs.execution_file == ''
        shell: bash
        run: |
          short='the review never started'
          headline='The review never started: the action produced no execution log, so the SDK was never reached and no API status exists. The failure is in the SETUP around it -- the GitHub App installation, the credential, or the action inputs -- and is nothing to do with this diff. A re-run repeats it until that setup changes.'

          # ESCAPED EVEN THOUGH EVERY CHARACTER HERE IS A LITERAL, and that is #1118's lesson rather
          # than belt-and-braces. The runner percent-DECODES a command's data, so an unescaped `%0A`
          # renders as a newline, and a workflow command counts at the START of a line. On literals
          # the substitution is a no-op -- but #1118 was precisely the branch that did not need
          # escaping until somebody interpolated a value into it, and it was then the only branch
          # without the guard. `pr-issues.tests.ps1` pins that EVERY emission site escapes, so this
          # one cannot quietly become that branch.
          #
          # There is no first-line cut beside it, unlike the step above, and that difference IS
          # deliberate: the cut bounds free text arriving from upstream, and this sentence is a
          # single line written here. An edit that appends anything read at run time needs it.
          echo "::error title=claude-review -- ${short}::${headline//%/%25}"

          {
            echo "### claude-review: ${short}"
            echo
            echo "$headline"
            echo
            echo 'The cause is the runner error line in the **Run Claude Code Review** step log --'
            echo 'this step cannot read it, so it is not repeated here. The measured instance is the'
            echo 'Claude Code GitHub App not being installed on the repository (a 401 on the app-token'
            echo 'exchange, issue #1245), which is an account-level install and not a repo change.'
          } >> "$GITHUB_STEP_SUMMARY"

      # THE STEP THAT DECIDES THE COLOUR -- issue #2000, Dave, September 14, 2026. Everything above is
      # unchanged in what it OBSERVES and what it SAYS; this is the only step with an opinion about
      # whether the job ends red, and it exists as its own step so that opinion sits in one readable
      # place rather than smeared across three `continue-on-error` flags.
      #
      # THE RULE, IN ONE SENTENCE: a failure is downgraded only when the run PROVES that nothing a
      # reader of this check can do would change the outcome. Today exactly one status proves that --
      # 429, where this file's own headline says in terms that re-running adds none.
      #
      # WHY NOT 529 TOO, since it is equally "nothing to do with this diff". Because that is not the
      # test. An overloaded API is transient and a re-run is a real remedy, so a red tick there is
      # information somebody can act on; quota is not and it is not. The two feel alike and behave
      # oppositely, which is exactly the kind of pair worth splitting explicitly instead of grouping by
      # how they read.
      #
      # THE EMPTY BRANCH IS RED, AND THAT IS THE FAIL-SAFE THE WHOLE STEP RESTS ON. `api_status` is empty
      # in three distinct cases and every one of them should be red: the SDK produced no result message
      # at all (the pre-SDK class #1245 measured -- a missing GitHub App install, a real setup defect),
      # the result carried no `api_error_status`, or the diagnostic step itself died under its
      # `continue-on-error`. None of those has PROVED anything, and this step downgrades only on proof.
      #
      # `always()` IS NOT IN THE CONDITION, deliberately. The job has not failed at this point -- the
      # review step defers its verdict with continue-on-error -- so the default `success()` is already
      # true here and `always()` would only add the case where an EARLIER step (the checkout) died, which
      # must stay red and which this step has nothing to say about.
      - name: Decide whether this check goes red
        if: steps.claude-review.outcome == 'failure'
        shell: bash
        env:
          # Quoted through the env block rather than interpolated into the script, which is this repo's
          # standing treatment for any value it does not own -- the same reason the diagnostic step reads
          # EXECUTION_FILE this way instead of splicing it in.
          API_STATUS: ${{ steps.why-failed.outputs.api_status }}
        run: |
          case "$API_STATUS" in
            429)
              echo "claude-review: the account is out of quota (api_error_status 429), so this PR got no review."
              echo "Not failing the check: re-running adds no quota, and there is no act available here that changes it."
              echo "The reason is on the annotation and in the job summary, both unchanged."
              {
                echo '### claude-review: no review, and the check is deliberately not red'
                echo
                echo 'The account behind `CLAUDE_CODE_OAUTH_TOKEN` is out of quota (`api_error_status: 429`),'
                echo 'so **this pull request was not reviewed**. The check is green because nothing a reader'
                echo 'of it can do would change that -- re-running adds no quota (issue #2000). Every other'
                echo 'failure of this job still goes red.'
                echo
                echo 'The upstream reason is on the failure annotation above and says which limit it is.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              # Named rather than summarised: the operator reading this line has the annotation too, and
              # the two should not disagree about which status was seen.
              echo "claude-review: failing the check -- api_error_status '${API_STATUS:-<none>}' is not the out-of-quota case (#2000)."
              echo "Only a 429 is downgraded. Read the annotation and the job summary for the reason."
              exit 1
              ;;
          esac
