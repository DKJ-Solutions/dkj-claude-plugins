# The brandbook app's gate (#3131): the same `npm run gate` the app's README names, on every change to the app or to the
# house-style copy it reads. It is the job dkj-brandbook ran as its own `ci` check, moved here with the app.
name: brandbook

# Least-privilege: this workflow only reads.
permissions:
  contents: read

# PATH-SCOPED, AND THEREFORE NOT A REQUIRED CHECK: a required check that a path filter skips never reports, and the PR
# then waits on it forever. lint-en-tests stays the one required check; this one gates the app's own changes.
on:
  pull_request:
    paths:
      - 'brandbook/**'
      - 'plugins/dkj-policy/assets/house-style/**'
      - '.github/workflows/brandbook.yml'
  push:
    branches: [main]
    paths:
      - 'brandbook/**'
      - 'plugins/dkj-policy/assets/house-style/**'
      - '.github/workflows/brandbook.yml'
  merge_group:

concurrency:
  group: brandbook-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: "brandbook-gate"
    runs-on: ubuntu-latest
    # A wedged check reads as "still running" forever (#2296); the gate takes well under a minute.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: brandbook
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: 'brandbook/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'brandbook/package-lock.json'
      - run: npm ci
      - name: Gate (eslint + CSS syntax + custom properties + colour tokens + tsc -b + vite build)
        run: npm run gate
