# The branch-entry gate AS A CONSUMER RUNS IT -- a reusable workflow (`on: workflow_call`), called from
# the few-line .github/workflows/branch-entry.yml that adopt-dkj-policy's Part 1 places (issue #2422).
#
# WHY THIS FILE AND NOT THIS REPO'S OWN branch-entry.yml. That one runs THIS tree's scripts/lint/ copy on
# this tree's own pull requests, so a PR changing the check is judged by the check it changes. A consumer
# has no such copy: it checks this repository out beside its own tree and runs the plugin mirror under
# plugins/dkj-policy/. Two different subjects, so two files -- and this one is the only definition of the
# consumer's runner, where every consumer used to carry a full copy of it (~50 lines, half of it this
# commentary) that the scaffolder wrote once and nothing ever corrected.
#
# WHAT A CALLER GETS WITHOUT RE-ADOPTING: a change to the runner, its steps, its timeout or this
# commentary reaches every consumer calling `@main` on its next pull request. The script itself already
# did, through the `ref: main` checkout below; the runner around it did not.
#
# THE github CONTEXT IS THE CALLER'S. In a called workflow `github.repository`, `github.head_ref` and
# `github.workspace` describe the consumer's run, so the first checkout is the consumer's tree and the
# head ref is the consumer's branch -- exactly what the copied runner read.
#
# `scripts-ref` DEFAULTS TO main, FOR THE #1805 REASON the copied runner states: a pinned gate goes on
# enforcing the shape it was pinned at, and the entry's own path has moved twice. A caller that pins this
# workflow at a tag (`...@v5.8.0`) should pass the same tag here, so the runner and the script it runs are
# one revision rather than a pinned runner around a moving script.
#
# IT PASSES -Pr, SO A CONSUMER HOLDS THE DEPLOY LOCK TOO (issue #2429) -- the half a PR merged from the
# GitHub UI still meets, which this repo's own branch-entry.yml has held since #884. Reading a PR body
# needs `pull-requests: read`, and that scope can only come from the CALLER: a called workflow can lower
# the caller's token, never raise it.
#
# SO THIS FILE DECLARES NO permissions: BLOCK, AND THAT IS THE COMPATIBILITY, NOT AN OMISSION. A called
# workflow that asks for a scope its caller did not grant fails to start at all -- so declaring
# `pull-requests: read` here would turn every caller scaffolded before #2429 (contents: read only) red on
# its next PR. Declaring nothing inherits exactly what the caller granted. A caller that grants the scope
# gets the lock; one that does not gets check-branch-entry.ps1's own "[INFO] PR #<n>'s body could not be
# read, so the DEPLOY lock was not checked" -- the behaviour it had before, said out loud.
#
# THE CALLER MUST THEREFORE DECLARE ITS OWN permissions: BLOCK. This file used to cap the job at
# `contents: read` whatever the caller did; it no longer can, so a caller with NO block runs this job --
# which executes a script fetched from another repo -- with the repo's default token, read-write on older
# repos. The caller Part 1 places declares `contents: read` + `pull-requests: read`; a hand-written one
# must declare at least `contents: read`.
#
# THE CALLER ALSO NEEDS `edited` IN ITS TRIGGER (issue #1710): `open-pr.ps1 -RefreshBody` repairs a drifted
# section by editing the body with no push behind it, and without `edited` the check cannot look again.
# Both halves are what adopt-dkj-policy's Part 1 places since #2429.
#
# LINUX, UNDER PWSH 7 (issue #2616, after #2488): ubuntu-latest and `shell: pwsh`, because on a private
# repo a Windows minute is billed above a Linux one. The shared scripts start children by the literal
# name `powershell`, which ubuntu-latest does not have, so one shim step points it at pwsh.
name: Branch entry (reusable)

on:
  workflow_call:
    inputs:
      scripts-ref:
        description: The ref of DKJ-Solutions/dkj-claude-plugins whose shared scripts this gate runs.
        type: string
        required: false
        default: main

jobs:
  branch-entry:
    runs-on: ubuntu-latest
    # 10 minutes against a job that measures well under one (issue #2296). The cap lives HERE and not in
    # the caller, because GitHub refuses timeout-minutes on a job that calls a reusable workflow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the shared workflow scripts
        uses: actions/checkout@v5
        with:
          repository: DKJ-Solutions/dkj-claude-plugins
          ref: ${{ inputs.scripts-ref }}
          path: .workflow-scripts

      # THE SHIM (issue #2488): the scripts launch children by the literal name `powershell`, and
      # ubuntu-latest has only `pwsh`. It runs before the first pwsh step.
      - name: Make `powershell` resolve to pwsh
        shell: bash
        run: sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell

      - name: Changelog entry written, and the DEPLOY section still matches the PR
        shell: pwsh
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # THROUGH env:, NEVER SPLICED INTO run: (#2622). The head ref is chosen by whoever opens the PR,
          # and an expression inside run: is expanded into the script text before the shell parses it, so a
          # branch name carrying $(...) or a quote would be code. merge-on-green.yml does the same.
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .workflow-scripts/plugins/dkj-policy/scripts/lint/check-branch-entry.ps1 -Branch $env:HEAD_REF -Pr $env:PR_NUMBER
          exit $LASTEXITCODE

      # THE PLANTED PLUGIN TREE (issue #2752, after #2746). specialists-init allows the workflow's entry
      # points without a prompt by a glob shaped like the install path, '*.claude*plugins*cache*<plugin>*
      # scripts*<entry>*'. A leading '*' constrains a path's shape and never its location, so the same rule
      # matches a .claude/plugins/cache/... tree committed INTO this repo -- and a script placed there would
      # run in the next session unprompted, with -ExecutionPolicy Bypass. Pinning the install root breaks the
      # rule at every plugin update, and a prompt per step reopens #1075, so the owner chose this third
      # option: the pull request that brings such a tree in is the one place to stop it, and this check is
      # the review gate every adopted repo already runs on every pull request.
      # THE TREE, NOT THE DIFF: the checkout is the PR's merge result at depth 1, so `git ls-files` reads it
      # with no history and no extra token scope. An installed plugin never belongs in a repo, so a tracked
      # path there is a finding whichever commit brought it. Its own step, and run even when the entry check
      # above failed, so the two verdicts are read apart.
      # IT MIRRORS THE GLOB'S SHAPE, NOT THE INSTALL LAYOUT (security and code review on #2752). The rule's
      # '*' spans characters inside a segment, so 'a.claude-x/pluginsY/cacheZ/p/scripts/e.ps1' matches it
      # and a grep for '.claude/plugins/' does not. So a regular entry is flagged when '.claude', 'plugins',
      # 'cache' and 'scripts' occur in that order anywhere in its path, case-insensitively. A symlink (120000)
      # or submodule (160000) is flagged when its path holds '.claude' at all: through one, the spelled path
      # continues inside a target this listing does not show. -z, because without it git C-quotes a path
      # with one non-ASCII byte and the quote breaks the match. Not covered, and said here so nobody reads
      # this as a guarantee: files inside a submodule, the segments smuggled into a command's arguments, and
      # a PR that edits this repo's own caller to drop the call. The check binds only where it is required.
      - name: No .claude/plugins/ tree tracked in this repo
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          shopt -s nocasematch
          planted=""
          while IFS= read -r -d '' entry; do
            mode=${entry%% *}
            path=${entry#*$'\t'}
            case "$mode" in
              120000|160000) [[ "$path" == *.claude* ]] && planted+="$mode $path"$'\n' ;;
              *) [[ "$path" == *.claude*plugins*cache*scripts* ]] && planted+="$path"$'\n' ;;
            esac
          done < <(git ls-files -z -s)
          if [ -n "$planted" ]; then
            echo "::error title=Plugin tree tracked in this repo (#2752)::This pull request's tree tracks a path shaped like an installed plugin's (.claude, plugins, cache, scripts), or a symlink or submodule under .claude. The allow rules specialists-init proposes run a workflow script found at such a path without asking. Remove these entries. If they are intended, the owner decides whether to merge past this red check."
            printf '%s' "$planted"
            exit 1
          fi
          echo "No path shaped like an installed plugin is tracked."
