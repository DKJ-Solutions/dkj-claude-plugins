# The branch-entry gate: every PR into main carries a WRITTEN changelog entry.
#
# WHY A SECOND WORKFLOW AND NOT A JOB IN ci.yml. That one runs on `push: branches: [main]` as well, and on
# the trunk there is no branch document at all -- it exists for the lifetime of a branch, and the fold
# removes it at the merge. A job of ci.yml would therefore be red on main after every single merge. The
# trigger is the difference, and a trigger belongs to a workflow rather than to a job.
#
# WHY THE HEAD REF IS PASSED EXPLICITLY. A `pull_request` checkout is a detached merge commit, so
# `git rev-parse --abbrev-ref HEAD` answers 'HEAD' there and the script would have no branch to judge.
# It refuses rather than guessing, which is why this line is not optional.
#
# WINDOWS, LIKE ci.yml, AND FOR THE SAME REASON: the scripts target Windows PowerShell 5.1, so they run
# under `shell: powershell` (5.1) rather than pwsh.
#
# THIS CHECK IS NOT IN THE main RULESET, deliberately. Making a check REQUIRED is a repo-settings change
# and therefore Dave's, not a script's -- so this reports on every PR and blocks nothing until he says
# otherwise. The local gates (open-pr refuses to push an unwritten entry, ship-pr refuses to merge with
# unresolved steps) are what hold today; this closes the hole they cannot: a branch pushed by hand, or a
# PR opened in the GitHub UI, meets neither of them.
#
# WHY IT ALSO CARRIES THE PR NUMBER SINCE AUGUST 25, 2026 (issue #884). The same script now holds the
# DEPLOY section against what the PR published -- the section is fixed once the PR opens, because it is
# what the review approved and what the fold puts into CHANGELOG.md. ship-pr refuses that merge locally;
# this is the half a PR merged from the GitHub UI still meets. Reading a PR body needs a scope the
# default token does not have, which is the one permission line below.
name: Branch entry

permissions:
  contents: read
  pull-requests: read

# 'edited' IS LOAD-BEARING AND IS NOT THE DEFAULT (issue #1710). Without a types: list, pull_request
# fires on opened/synchronize/reopened -- a push, in other words. But half of what this check judges is
# the PR BODY, and the body changes with no push behind it: `open-pr.ps1 -RefreshBody` is the documented
# remedy for a DEPLOY section that has drifted from what the PR published, and it edits the body through
# the API and reports 'Everything up-to-date'. So the one action that repairs the drift this check
# reports could not make it look again.
#
# MEASURED ON PR #1707: the check correctly reported drift at 11:57, -RefreshBody republished the
# section at ~12:05, ship-pr's own arm of the same lock read the refreshed body and passed, and the
# merge landed at 12:08 with this check still red -- describing a state that had stopped being true
# eleven minutes earlier, on the one PR whose author had taken the honest route. Two arms of one lock
# reaching opposite verdicts, because only one of them could be asked twice.
#
# 'edited' also fires on a title change and a base change, so a person editing the description costs
# one ~20s job. That is the whole price, and it buys a trigger that matches the check's subject.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

jobs:
  branch-entry:
    runs-on: windows-latest
    # 10 MINUTES, AND THE CAP IS A WEDGE DETECTOR RATHER THAN A PERFORMANCE BUDGET -- issue #2296. A job
    # with no timeout-minutes runs to GitHub's SIX-HOUR default; this one measures under a minute over its
    # 20 most recent successful runs, so 10 is an order of magnitude of headroom and still bounds a wedge.
    # The full derivation, and the incident it was written for, are in the banner above jobs: in ci.yml.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Changelog entry written, and the DEPLOY section still matches the PR
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/lint/check-branch-entry.ps1 -Branch "${{ github.head_ref }}" -Pr "${{ github.event.pull_request.number }}"
          exit $LASTEXITCODE
