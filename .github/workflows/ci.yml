# CI gate: runs the lint gate + all test suites on every PR, every push to main, and every merge-queue
# entry (the last is inert until a queue is enabled -- see the `merge_group` note on the trigger block).
# This is the same guard that open-pr.ps1 runs locally, but inescapable -- even a PR that
# originates outside the scripts (GitHub UI, or a forgotten -SkipLint) passes through here.
# The scripts target Windows PowerShell 5.1, so every job that RUNS one is on windows-latest with
# `shell: powershell` (5.1), not pwsh. Since #1351 there is one job that runs none -- the
# `lint-en-tests` summary at the foot of this file, which only compares two strings -- and it is on
# ubuntu for that reason; see its own note.
name: CI

# Least-privilege (Sean's advice): this workflow only reads -- the GITHUB_TOKEN gets no write access.
permissions:
  contents: read

# THE `merge_group` TRIGGER IS A PREREQUISITE, NOT A FEATURE -- issue #1325. It is inert until a merge
# queue is switched on for `main` (a repo-settings change, and Dave's), and it has to be here BEFORE
# that happens rather than after: a required workflow with no `merge_group` trigger never runs for a
# queue entry, so the required `lint-en-tests` check never reports and GitHub's own warning is that the
# merge then fails. That is a total merge outage on `main`, not a degradation -- which is why the
# trigger lands first, on its own, and is proven green on the trunk before anything is enabled.
#
# WHY A QUEUE IS THE ANSWER AT ALL: `lint-en-tests` runs ~14-16 min while `main` gains a merge every
# ~15-25 min, so a certificate is routinely stale by the time it is spent (#1292, and the ship-pr step
# 3b gate that catches it). Every repo-settings remedy that is NOT a queue was measured and rejected on
# #1325 -- `strict_required_status_checks_policy` + `allow_auto_merge` + `allow_update_branch` were all
# turned on and reverted the same day, because GitHub performs NO server-side base-sync of a PR branch
# outside a queue. A queue tests each entry against the PROJECTED merge (trunk tip + the entries ahead
# of it), so staleness is gone by construction rather than blocked harder.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# TWO GROUPING RULES IN ONE KEY: a PR is keyed on its REF, everything else on its own COMMIT.
#
# "EVERYTHING ELSE" IS TWO EVENTS SINCE #1325, and the key needed no change to take the second one. The
# expression's `|| github.sha` arm was written for pushes to `main`; a `merge_group` run lands there too
# and gets the queue entry's own temp commit, which is already unique per entry, and `cancel-in-progress`
# is false off the PR arm -- so no queue entry can cancel another. That is the behaviour a queue requires
# and it falls out of what #1294 already built, which is why this comment gains a paragraph rather than
# the key gaining a branch.
#
# THE PR HALF IS THE CHEAP HALF and is unchanged. A PR run that a later push supersedes is measuring a
# commit nobody will merge, so killing it is free: `synchronize` fires on every push, which is how PR
# #933 came to carry three consecutive full runs of one branch at ~7m40s each, on a runner whose
# minutes bill double. So PR runs share a group per `github.ref` and cancel each other.
#
# THE PUSH HALF IS KEYED PER COMMIT, AND `cancel-in-progress` IS NOT WHAT PROTECTS IT -- issue #1294.
# Every push to `main` used to share one `refs/heads/main` group, with the conditional below relied on
# to stop the fold commit cancelling the merge commit's run. That could not work: a concurrency group
# holds at most one IN-PROGRESS run plus one PENDING one, and a third arrival DROPS the pending one
# without consulting `cancel-in-progress` at all. ship-pr pushes to `main` twice per branch -- the
# merge commit, then the fold commit that clears the branch document, measured 6s apart on #932 -- so
# on a ~15-minute run the merge commit's run was still queued when the fold displaced it.
#
# MEASURED September 3, 2026 over the 28 most recent `merge:` commits on the trunk's first-parent line:
# 14 `success`, 14 `cancelled`. Half the trunk had never been gated. Run 33742497546 (merge commit
# 371af75b, #1268) was created 10:06:15Z and cancelled 10:06:23Z having allocated ZERO jobs, which is
# the proof it never left the queue rather than being killed mid-run. And it was never only folds
# displacing merges: 0ab47d2d, 2c54de74 and e0175372 went down in one chain, so on a busy trunk only
# the LAST push of each ~15-minute window ran at all. The tip was always gated; nothing between it and
# the previous tip ever was, which is why that day's two `failure` runs named no commit.
#
# THE EXTRA RUNNER MINUTES ARE THE POINT, NOT AN OVERSIGHT: every push to `main` now runs, where before
# roughly half were dropped -- 27 runs instead of 13 on September 3. The PR saving above is untouched,
# because the push half never shared a group with a PR in the first place (`github.ref` is
# refs/pull/N/merge there and refs/heads/main here), so none of what #932 measured is reopened.
#
# THE FOLD COMMIT'S HALF OF THAT COST IS TRIMMED IN THE JOB BELOW -- issue #1300. It keeps its lint run
# and skips the ~13-minute suites, because the only thing its tree adds over the merge commit's is
# changelog prose the PR already checked. The `if:` sits on the step, not here: the run still has to
# happen so the fold commit (the trunk tip after a ship) carries a green `lint-en-tests` of its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# THREE JOBS, AND THE REQUIRED CHECK IS THE LAST ONE -- issue #1351, September 3, 2026.
#
# WHY IT IS THREE. This was one `lint-en-tests` job running lint then suites, and 95% of its wall clock
# was the second half: on run 33798952362, 12m23s of 13m03s, reported by the gate itself as 'all 64 suites
# passed in 742s (4 lanes)'. The same pool takes ~200s on 16-18 lanes on a workstation. Normalised, that is
# 2968 lane-seconds here against ~3400 there -- comparable total work, so the 3.7x is LANE COUNT, and
# `windows-latest` has four cores. The gate was contention-bound rather than critical-path-bound (see
# Invoke-TestSuiteGate's own SHARDING banner), and the only way to give a four-core runner more lanes is to
# use more runners. So the suites fan out over a matrix, the lint keeps its own job (running it once per
# shard would pay 27s and print its output four times over), and a third job carries the NAME.
#
# THE NAME IS THE POINT: `main-ci-gate` requires a check called `lint-en-tests`, and GitHub names a check
# after the job that reports it. Keeping a job by that exact name means this restructure needs NO ruleset
# edit, no repo-settings change and nobody's permission -- which is the whole reason it could be done while
# the merge-queue decision on #1325 was still open. It has since been settled -- NO queue (#1355,
# September 3, 2026) -- which changes nothing here. Do not rename this job. Renaming it silently un-gates
# `main`: the ruleset would wait forever for a check nobody reports, and every merge would block.
#
# `if: !cancelled()` PLUS AN EXPLICIT RESULT CHECK, AND BOTH HALVES ARE LOAD-BEARING. A job that
# `needs:` a failed job is SKIPPED, not failed, and a skipped required check is not a reported failure --
# so without an `if:` that outlives a failed dependency a red shard produces no verdict at all, and
# without the result check that `if:` produces a GREEN one. That combination is the single classic
# footgun of this pattern and it is the same silence class as #1294's dropped runs: a check that reports
# success having measured nothing. It is asserted in ci-shard.tests.ps1 in both directions rather than
# trusted to this comment.
#
# `!cancelled()` AND NOT `always()` -- issue #1356. `always()` is true even when the run was CANCELLED,
# and `cancel-in-progress` cancels the four shards whenever a PR run is superseded by a newer push. The
# summary job would then run anyway, read `cancelled != success`, and report the required check as
# FAILURE where nothing failed -- a red run in the Actions list on a commit nothing merges, plus a
# wasted runner per cancellation. `!cancelled()` keeps every property above: it is true when a
# dependency failed or was skipped, so the fail-closed check still fires, and false only when the run
# itself was cancelled, so a superseded run reports `cancelled` rather than `failure`.
#
# STRICT SUCCESS, NOT 'not failure'. `success` is required from every leg, so `skipped`, `cancelled` and
# `neutral` all refuse. That is deliberate and it is why the fold-commit shortcut below stays on the STEP
# rather than moving up to the job: a job-level `if:` would make `needs.suites.result` legitimately
# `skipped` on a fold commit, and this job would then have to accept `skipped` from that leg -- one
# accepted non-success away from accepting the one that matters. Four short runners on a fold commit cost
# nothing on a public repo's standard runners; a summary job with an exception in it costs the gate.
#
# EVERY JOB DECLARES `timeout-minutes`, AND THE NUMBERS ARE READ OFF RUN HISTORY -- issue #2296,
# September 22, 2026. A job with none runs to GitHub's default of SIX HOURS, and until that issue no job
# in this repo's .github/workflows/ declared one.
#
# WHAT THAT COST. Run 35728958033's `suites (2)` wedged: 38 minutes and still `in_progress`, on a commit
# whose other three shards went green in about six minutes each and whose shard 2 ran all 29 of its
# suites locally in 344s. `lint-en-tests` `needs:` the shards, so it never registered at all -- and a
# required check that never registers is not a red check somebody can read, it is a branch that cannot
# merge with nothing saying why. ship-pr spent its whole 1800s registration wait and refused correctly;
# the branch still needed a person to go and cancel the job by hand, which itself took ~8 minutes to land.
#
# AND THE IN-PROCESS BOUND CANNOT COVER IT. $script:GateSuiteTimeoutSeconds (native-capture-lib.ps1) is
# 1800s PER SUITE and reaps a wedged child with an attribution -- it has done so three times on a local
# machine (#1941). At 38 minutes -- 2,280 seconds, so eight minutes past that bound -- it should have
# fired and did not, so whatever wedged sat BELOW the level a gate inside the process can reach. That class is exactly what a
# runner-level cap is for, and it is why this is not a duplicate of #1941/#2233/#2255/#2263 -- those are
# all the in-process bound, this is the one layer under it.
#
# 25 ON `suites`, AND THE NUMBER IS PICKED AGAINST ship-pr's WAIT, NOT JUST AGAINST THE SUITES. Over the
# 19 most recent successful runs the shards measure: (1) med 8.5m/max 9.2m, (2) med 12.5m/max 13.4m,
# (3) med 7.1m/max 7.4m, (4) med 6.3m/max 8.5m -- so 25 is ~1.9x the worst shard ever observed and
# nothing legitimate comes near it. What decides the upper end is that ship-pr's registration wait is
# ALSO 1800s (`$maxRequiredWaitSec`, ship-pr.ps1): a cap at 30 or above times the job out at the same
# moment the shipping session gives up, so the session still learns nothing. At 25 the shard goes red,
# `lint-en-tests` concludes seconds later, and ship-pr -- still inside its wait -- reads a FAILED
# required check with a job log naming which shard, which is a diagnosis instead of a silence.
# Re-derive it from scripts/tests/suite-durations.json and the run history, never from this paragraph.
#
# 10 ON `lint` (max 1.5m) AND 5 ON THE SUMMARY (max 0.1m, two string comparisons on ubuntu). Both are
# far above anything measured, deliberately: the cap is a wedge detector, not a performance budget, and
# a cap that fails a merely slow run turns this guard into the thing it was built to prevent.
jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Lint gate (check-plugin-integrity)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/lint/check-plugin-integrity.ps1
          exit $LASTEXITCODE

  suites:
    runs-on: windows-latest
    # 25, against a worst observed shard of 13.4m and against ship-pr's own 1800s registration wait --
    # see the timeout-minutes banner above jobs: for both halves of that derivation (#2296).
    timeout-minutes: 25
    strategy:
      # FOUR, AND A SHARD'S FLOOR IS max(ITS LONGEST FILE, ITS LANE-SECONDS / 4) -- issue #1358,
      # corrected September 4, 2026 against the first REAL per-suite tables. This comment used to name
      # only the first term, on #714's authority, and concluded that more shards cannot help and that a
      # duration-aware assignment would hit the same wall. THE SECOND TERM IS THE ONE THAT WAS BINDING.
      # Read off runs 33842129201 and 33812817842 (the tables the gate prints, not timestamps): three of
      # four shards finished 41-95s ABOVE their longest file, because a quarter of the pool over four
      # lanes already exceeded it. Shard 3 ran 317s with a 221.8s heaviest file.
      #
      # WHY THE OLD READING LOOKED SOLID: it was measured on the four check-plugin-integrity-* suites,
      # which the stride happened to place in queue positions 3-4 -- the only positions where a duration
      # could be read off a log at all. So the evidence came entirely from the shards where the file WAS
      # the binding constraint, and was generalised to the ones where it is not.
      #
      # SO THE PARTITION IS THE LEVER, AND IT IS NOW COST-AWARE. Invoke-TestSuiteGate packs shards
      # longest-first over scripts/tests/suite-durations.json and dequeues each shard in the same order;
      # simulated over the measured pool that is 305s -> 237s. Both halves were needed: packing WITHOUT
      # reordering measures 307s, which is worse than doing neither. See Get-TestSuiteShardOrder for the
      # four-way simulation, and note the file is a HINT -- delete it and this job runs the old stride,
      # with the same suites and the same coverage.
      #
      # AND THAT IS WHY THE SHARD COUNT STILL DOES NOT GO UP. Another runner lowers only the second term.
      # At 237s the pool is finally at its longest FILE, so a fifth shard buys its own ~20s of
      # provisioning and nothing else. The remaining lever is inside that file, and #1358 priced it: a
      # split takes the floor the last ~15s to the 16-lane work bound, for the price of preserving 340
      # asserts across ~2,950 lines. Not bought.
      #
      # ~30s CAME OFF THE PER-FILE COST separately in #1358, by making the lint parse and walk the script
      # set once instead of twice (see Get-PsScriptCommandAsts in check-plugin-integrity.ps1): those four
      # suites are ~100% lint invocations -- 52 of them in the heaviest, at ~1.12s each on a workstation --
      # and they measured 58.7/55.7/51.0/34.5s before and 50.8/48.9/44.7/30.3s after, every assert count
      # unchanged. A caller staring at a slow required check should price that route before buying a runner.
      #
      # DO NOT RECONSTRUCT DURATIONS FROM LOG TIMESTAMPS -- THE GATE PRINTS THEM (#1358, PR #1364). Each
      # shard's log carries a 'per-suite durations, slowest first' table holding every suite's duration,
      # the offset at which its lane opened, and a marker on the one that set the makespan. Read that.
      # WHY THE WARNING IS STILL HERE now that the table exists: the gate buffers each suite's output
      # until that suite completes, so a log timestamp is a FINISH time and always was. Subtracting the
      # shard start from it is a duration only for a suite in queue positions 1-4 -- and that is how the
      # figures on #1358 came to name a five-file plateau that has four, by extending the method to two
      # suites sitting 5th and 9th in a 4-lane queue and reading their lane wait as runtime. The table is
      # the answer to that; the timestamps are still there and still misleading.
      #
      # AND DO NOT QUOTE A COUNT OF HEAVY FILES FROM THIS COMMENT'S OWN HISTORY -- it has said five and it
      # has said four, and the recorded tables say about a dozen, seven of which appear in neither list.
      # They also named a different heaviest suite than #1358 did. Anything about which files are heavy
      # comes from the table on a 4-lane run, not from a workstation and not from prose. That is also what
      # suite-durations.json is: those tables, written down, and regenerated by
      # scripts/maintenance/record-suite-durations.ps1 rather than retyped.
      #
      # fail-fast IS FALSE, DELIBERATELY. The default would cancel the surviving shards the moment one goes
      # red, which costs exactly the information this repo needs most from a red gate: these suites have a
      # measured history of red-under-the-gate/green-alone (#1033, and the two earlier sightings its
      # comment names), and the standing response is to re-run the suite alone. Losing three shards' worth
      # of verdicts to learn one of them failed turns one re-run into four.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      # THE SAME SHARED GATE open-pr.ps1 AND cut-release.ps1 RUN, not a third copy of its loop. This step
      # held an inline copy until August 7, 2026 (issue #512), which is how it would have kept running the
      # suites one at a time for days after both local callers were parallelised -- the copy nobody looks
      # at being the one that drifts.
      #
      # -MaxParallel IS PASSED EXPLICITLY, because the default is wrong here for a good reason. The gate
      # holds two cores back so a developer's machine stays usable while it runs; a GitHub runner has
      # nobody sitting at it and only four cores, so that reservation would cost half the box. The
      # knowledge of which kind of machine this is lives here, not in the lib.
      # SINCE ISSUE #2121 THE DEFAULT ALSO SIZES ITSELF ON FREE MEMORY, and that term is wrong here for
      # the same reason the core one is: it is calibrated for a machine somebody is sitting at, with an
      # editor and a browser on it. Both are skipped by passing a number, so this line needs no change
      # to stay correct -- it is noted because a reader who only met the core sentence above would
      # conclude the override has one reason, and act on it when that one stops applying.
      # repo-config.ps1 IS DOT-SOURCED HERE TOO (inbound #644): the gate reads the optional
      # Get-TestCommands from it, and open-pr and cut-release have it in scope from their own
      # dot-source. Leaving it out here would make CI -- the one caller that actually blocks the
      # merge -- the one gate that cannot see a repo's extra test commands, silently. Guarded,
      # because this workflow may be copied into a repo that has no repo-config yet.
      #
      # THE FOLD COMMIT SKIPS THIS STEP -- issue #1300. ship-pr pushes twice per branch: the merge
      # commit, then the fold commit, whose tree differs by exactly two non-executable things -- the
      # entry appended to dkj-policy/CHANGELOG.md and the removed
      # dkj-policy/<branch>.md. Since #1294 keyed every push to `main` on its own
      # commit, that second push otherwise runs a full ~15-minute suite over a tree whose only untested
      # delta is changelog prose. That entry is a verbatim copy of the branch document's DEPLOY section,
      # which check 4 of the lint gate (still run above) link-scans on the PR and branch-entry.yml
      # shape-checks there -- so the suites add nothing on the fold, while the lint step keeps the trunk
      # tip carrying a green check of its own.
      #
      # THE CONDITION IS COMMIT-KIND, NOT A PATH FILTER. `paths-ignore` on the push trigger would also
      # skip a *merge* commit whose branch happened to touch only those two paths (a docs/ branch editing
      # the changelog intro) -- a narrow reopening of #1294's gap. `head_commit.message` names the commit
      # kind exactly. A PR never matches (`github.event_name` is not 'push' there), so the `main`
      # ruleset's required `lint-en-tests` check is untouched; on a push a skipped step still reports the
      # job green.
      #
      # A MERGE-QUEUE RUN NEVER MATCHES EITHER, and must not: `github.event_name` is 'merge_group' there,
      # so the suites run in full. A queue entry IS the gate -- it is the projected merge being certified
      # before it lands -- so the fold-commit shortcut above, which skips the suites for a tree whose only
      # untested delta is changelog prose, has nothing to say about it (#1325).
      # THE SHARD IS TWO INTEGERS, NOT A LIST OF SUITES (issue #1351). The gate takes the partition from
      # -Shard/-ShardCount and computes it over its own glob of scripts/tests, so this workflow never
      # names a suite and cannot drift from the contents of that folder -- the same reason #512 deleted
      # the inline loop this step used to hold. -ShardCount MUST equal the length of the matrix above;
      # ci-shard.tests.ps1 asserts that by reading both numbers out of this file, because a mismatch is
      # silent in the worst direction: a matrix of four against a count of five runs four fifths of the
      # pool and reports four green shards, for ever.
      - name: Test suites (shard ${{ matrix.shard }} of 4, scripts/tests/*.tests.ps1)
        if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'fold:')) }}
        shell: powershell
        run: |
          . ./scripts/lib/native-capture-lib.ps1
          if (Test-Path ./scripts/repo-config.ps1) { . ./scripts/repo-config.ps1 }
          $gateOk = Invoke-TestSuiteGate -TestsDir ./scripts/tests -Context 'CI' -MaxParallel ([Environment]::ProcessorCount) -Shard ${{ matrix.shard }} -ShardCount 4
          if (-not $gateOk) { exit 1 }
          exit 0

  # THE REQUIRED CHECK. Reports nothing of its own -- it exists so that `main-ci-gate`'s single required
  # context still names one job while the work happens in five. See the banner above jobs: for why the
  # name must not change, and why `!cancelled()` and the strict result check are both required.
  lint-en-tests:
    needs: [lint, suites]
    if: ${{ !cancelled() }}
    # ubuntu, deliberately: this job runs no PowerShell and never touches the repo, so the windows-latest
    # note at the top of this file does not apply to it -- and a linux runner starts in seconds where a
    # windows one costs a minute for the same two string comparisons.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg must have succeeded
        shell: bash
        run: |
          echo "lint:   ${{ needs.lint.result }}"
          echo "suites: ${{ needs.suites.result }}"
          # A matrix job's aggregate result is 'success' only when EVERY entry succeeded, which is what
          # makes one comparison enough for all four shards.
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.suites.result }}" != "success" ]; then
            echo "::error::CI gate failed -- lint=${{ needs.lint.result }} suites=${{ needs.suites.result }}"
            exit 1
          fi
          echo "CI gate green: lint and all 4 suite shards succeeded."
