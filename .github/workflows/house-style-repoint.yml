# The house-style repoint runner: a release of dkj-brandbook becomes one pull request here -- issue #3100.
#
# WHAT IT REPLACES. A brand-book release reached the apps only after a session repointed the house-style
# skill by hand -- links, commit, both checksums, the retired-name list, two vendored copies -- four times
# in five days (#2986, #3033, #3089, #3084). scripts/ci/repoint-house-style.ps1 does that work; this file
# only decides when, and turns the result into a branch and a pull request.
#
# IT OPENS, IT NEVER MERGES. The pull request carries no merge-on-green label, so it waits for a person:
# the two DEPLOY scores are left empty for them, because whether a release is cosmetic or noticed by every
# app is a judgement this runner cannot make. Where house-theme.js changed, the branch document also
# carries an open step to read its diff: the script's denylist decides whether a pull request opens, and
# no denylist can prove a script that is inlined into every app harmless.
#
# FOLD_PUSH_TOKEN, AND ONLY IN THE TWO STEPS THAT WRITE. A pull request opened with the job-scoped
# GITHUB_TOKEN starts no workflow runs, so ci.yml's required check would never report and the pull request
# would sit unmergeable; this repo also does not let GitHub Actions create pull requests at all. The PAT
# already holds `Contents` and `Pull requests: write` for merge-on-green.yml, so this adds no scope -- only
# a second workflow that holds it. The checkout therefore runs with the job token and
# persist-credentials: false, so the PAT is never on disk while the brand book's files are fetched and
# parsed; it reaches the push as a one-command header and `gh` through env:, as merge-on-green.yml does.
# The brand book is public: reading its release needs no secret (#3100).
#
# FAIL-CLOSED. A tag that is no published release, a failed fetch, a file the denylist refuses, or a page
# the rewrite does not recognise fails the script, and this job opens nothing. The red run is the signal.
name: House-style repoint

permissions:
  contents: read

on:
  schedule:
    # 07:15 UTC daily: a brand-book release is cut by hand, at most a few times a week, so a day bounds the
    # wait and workflow_dispatch below covers the day it cannot.
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to repoint at (vX.Y.Z). Empty: the brand book''s latest release.'
        required: false
        default: ''

concurrency:
  # Not cancelled: a run that has pushed its branch and not yet opened the pull request must finish.
  group: house-style-repoint
  cancel-in-progress: false

jobs:
  repoint:
    runs-on: ubuntu-latest
    # A wedge detector, not a budget (ci.yml's banner, #2296): the job is a few fetches and one commit.
    timeout-minutes: 15
    steps:
      # Pinned by SHA like every checkout in a job that holds the PAT (fold-on-merge.yml's header).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # THE SHIM (issue #2488): the scripts launch children by the literal name `powershell`.
      - name: Make `powershell` resolve to pwsh
        shell: bash
        run: sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell

      # The input arrives through env:, never through ${{ }} inside run:, and the script refuses anything
      # that is not a published vX.Y.Z release before the tag reaches a branch name.
      - name: Is a repoint due?
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/repoint-house-style.ps1 -CheckOnly -Tag "$env:INPUT_TAG"
          exit $LASTEXITCODE

      # ONE REPOINT PULL REQUEST AT A TIME, AND ONLY OUR OWN. A pull request from a fork is never touched.
      # The same branch already open: nothing to do. An OLDER tag's repoint still open: closed as
      # superseded, since the new one carries everything it did; a newer one stops this run instead.
      # The same branch on origin with no open pull request (a create that failed, a close without
      # deleting it) is deleted, so the build below does not fail on a non-fast-forward every day.
      - name: Is its pull request already open?
        id: open
        if: ${{ steps.check.outputs.due == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.FOLD_PUSH_TOKEN }}
          BRANCH: ${{ steps.check.outputs.branch }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          $json = gh pr list --state open --limit 100 --json number,headRefName,isCrossRepository
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $prs = @($json | ConvertFrom-Json | Where-Object { -not $_.isCrossRepository -and $_.headRefName -match '^feat/house-style-v\d+-\d+-\d+$' })
          $mine = [version]($env:TAG.Substring(1))
          $already = $false
          foreach ($pr in $prs) {
              $theirs = [version](($pr.headRefName -replace '^feat/house-style-v', '') -replace '-', '.')
              if ($pr.headRefName -eq $env:BRANCH) { $already = $true; Write-Host "#$($pr.number) already repoints at $env:TAG."; continue }
              if ($theirs -gt $mine) { Write-Host "#$($pr.number) repoints at a newer tag than $env:TAG; nothing to do."; $already = $true; continue }
              gh pr close $pr.number --delete-branch --comment "Superseded by the repoint to $env:TAG."
              if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          if (-not $already) {
              git ls-remote --exit-code --heads origin $env:BRANCH | Out-Null
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "$env:BRANCH is on origin with no open pull request; deleting it to rebuild."
                  gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$env:BRANCH"
                  if ($LASTEXITCODE -ne 0) { exit 1 }
              }
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "already=$($already.ToString().ToLowerInvariant())"

      - name: Build the branch and open the pull request
        if: ${{ steps.check.outputs.due == 'true' && steps.open.outputs.already == 'false' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.FOLD_PUSH_TOKEN }}
          BRANCH: ${{ steps.check.outputs.branch }}
          TAG: ${{ steps.check.outputs.tag }}
          FROM: ${{ steps.check.outputs.from }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # new-branch.ps1 cuts the branch and scaffolds its document, exactly as a session does.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/task/new-branch.ps1 -Name $env:BRANCH -Title $env:TITLE -NoPush
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $doc = 'dkj-policy/' + ($env:BRANCH -replace '/', '-') + '.md'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/repoint-house-style.ps1 -Tag $env:TAG -BranchDocument $doc
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git add -A
          git commit -m "feat: house-style skill repointed to dkj-brandbook $env:TAG" -m "Opened by the house-style repoint runner (#3100)."
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The PAT for this one command only, never written to .git/config.
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:PUSH_TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push -u origin $env:BRANCH
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $body = @(
              "DKJ-Solutions/dkj-brandbook released [$env:TAG](https://github.com/DKJ-Solutions/dkj-brandbook/releases/tag/$env:TAG); the house-style skill pinned $env:FROM.",
              '',
              "Opened by the house-style repoint runner (#3100). Before shipping: read the release, tick any open step in ``$doc`` (a changed ``house-theme.js`` has one), score the two DEPLOY tiers, and say there what an app that takes the new copy will notice."
          ) -join "`n"
          $env:GH_TOKEN = $env:PUSH_TOKEN
          gh pr create --base main --head $env:BRANCH --title $env:TITLE --label feature --body $body
          exit $LASTEXITCODE
