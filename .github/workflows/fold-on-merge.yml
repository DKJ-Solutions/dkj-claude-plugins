# The fold-on-merge gate: folds a queue-merged PR's changelog entry, since the session that ships it
# never sees the merge (issue #1493).
#
# WHAT THIS CLOSES. fold-changelog-entry.ps1 has always run from exactly one place -- ship-pr.ps1,
# as the shipping session's own next step after its own merge call returns. The merge queue (#1492)
# merges a PR itself, in a process that session never observes, so that step never runs: the branch's
# dkj-policy/<branch>.md sits on the trunk, unfolded, until check-unfolded-entry.ps1 notices it after
# the fact (a SessionStart hook, or the advisory unfolded-entry.yml push check), with nobody to fold
# it but a human doing it by hand. This workflow is the fold running from the one place that always
# sees a queue merge: a push to main.
#
# IT ADDS NO RULE OF ITS OWN, AND NO SECOND DETECTOR. It runs check-unfolded-entry.ps1 -Branch main
# unchanged -- the exact function (Get-UnfoldedTrunkEntry) unfolded-entry.yml already reports with --
# and only when THAT finds a leftover does it call fold-changelog-entry.ps1 -Commit -Push.
#
# FOLD-ALL MODE, DELIBERATELY, RATHER THAN A BRANCH DERIVED FROM THE PUSH EVENT.
# fold-changelog-entry.ps1 already discovers every unfolded per-branch document with no branch named
# -- the same declared-branch read check-unfolded-entry.ps1 uses -- and resolves each one's own PR via
# its own `gh pr list` lookup keyed on that declared branch. The associated-PR API
# (GET /repos/{owner}/{repo}/commits/{sha}/pulls) or a parse of the merge-commit message would answer
# a question this already answers from the tree itself, for one branch per run instead of the whole
# backlog a push might be carrying.
#
# contents: read + pull-requests: read, AND NOTHING ELSE, for the default GITHUB_TOKEN. pull-requests:
# read is not optional: the fold step's own `gh pr list` needs it, and declaring any permissions block
# at all sets every unlisted scope to none. contents: write is deliberately NOT granted here -- the
# actual push authenticates as FOLD_PUSH_TOKEN (see below), which the checkout step wires in directly
# and which never touches this permissions block at all.
#
# PUSHES AS AN ORG ADMIN, NOT AS THE GITHUB ACTIONS APP (issue #1493). TWO of main-ci-gate's rules
# block any push to main unless the pushing actor is a listed bypass actor -- required_status_checks
# AND merge_queue, and naming only the first is what made a diagnosis unreadable once already (issue
# #1499, below). The default GITHUB_TOKEN pushes as the GitHub Actions app (integration_id 15368),
# which is not on that bypass list -- and cannot be added to it: that app is owned by `anthropics`,
# installed on this org but not administered by it, so there is no private key for it to authenticate
# as. The bypass list already carries `OrganizationAdmin` with `bypass_mode: always`, so this job
# checks out with a fine-grained personal access token (secrets.FOLD_PUSH_TOKEN) belonging to an org
# owner instead -- that identity already bypasses the ruleset today, with no ruleset change needed.
# The token is scoped to this repository only and to `Contents: Read and write` only, and it expires
# within the org's enforced 366-day maximum, so it needs rotating before then or this job starts
# failing its push again with no code-level cause. THIS IS A STANDING CREDENTIAL, NOT A FIX-FOR-FIX
# SWAP: the default GITHUB_TOKEN it replaces is job-scoped and expires in about an hour, unusable
# outside this one run; FOLD_PUSH_TOKEN is usable from anywhere for up to a year, and because
# actions/checkout's default `persist-credentials: true` writes it into the workspace's git config,
# every step of this job holds it, not only the push step. Sebastian's review of #1493's PR flagged
# this asymmetry as worth stating rather than leaving implicit in the rotation note alone.
#
# WHAT A RED RUN HERE MEANS, because THREE entirely different things turn this job red and only the log
# tells them apart (issues #1499, #1539, #1543):
#
#   1. THE CHECKOUT FAILING on the token. actions/checkout is given token: FOLD_PUSH_TOKEN, which
#      overrides its GITHUB_TOKEN default -- so an absent, expired or under-scoped secret fails step 1
#      and leaves every later step `skipped`, with no fold step to read at all. Rule this one out first:
#      it is the only cause that produces no fold output. A fine-grained PAT lists repositories one by
#      one, so a repo created rather than transferred (an org move with no GitHub transfer does exactly
#      that) silently falls outside an existing token's selection -- measured in a BWJ consumer,
#      2026-09-07, on the first two runs after this file was placed there (#1539).
#
#   2. THE FOLD REFUSING. It ran and declined; its own last lines say why. The #1497 misread of
#      dkj-policy/CHANGELOG.md (2026-09-05 23:56 and 2026-09-06 07:32, repaired by #1498) was this.
#      TWO refusals are excluded from this list and no longer turn the job red at all -- the trunk-gap
#      guard, exit code 2 (#1586), and the redundant-fold verdict, exit code 3 (#1796), both of which
#      the fold step translates into a stood-down green. The list stays three because neither is a
#      failure mode: both are this job finding that the trunk already holds, or is about to hold, the
#      entry it was triggered to put there. See THE RACE HAS TWO SIDES below.
#
#   3. THE FOLD SUCCEEDING and its push being rejected BY THE RULESET -- a clean fold above a GH013.
#      READ THE REJECTION, because a push can also be refused as a NON-FAST-FORWARD, which looks like
#      this cause and is not it: that one is the race below, and where the fold proves the entry is
#      already upstream it never reaches this list at all (exit 3). GH013 names a rule and a ruleset;
#      a non-fast-forward names a ref and tells you to fetch first. A non-fast-forward that the fold
#      canNOT prove redundant -- one entry upstream, another genuinely new -- is still exit 1 and is
#      still this cause, correctly: that commit carries work the trunk does not have.
#      Measured verbatim in run 34020828593, the push carrying the #1498 merge, 2026-09-06 08:04:
#
#        Folded and removed: dkj-policy/fix-1497-fold-all-reserved-names.md (tier 2, significance 4 -- ...)
#        CHANGELOG.md updated.
#        Committed: fold: fix/1497-fold-all-reserved-names changelog (#1498)
#        remote: error: GH013: Repository rule violations found for refs/heads/main.
#        remote: - Required status check "lint-en-tests" is expected.
#        remote: - Changes must be made through the merge queue
#
# #1499 was filed on runs 1-3 above read as one symptom -- two fold refusals and one ruleset rejection
# with a clean fold above it. The fold step going red is not by itself evidence that the fold refused;
# read the fold script's own last lines, which say which of the three happened in so many words.
#
# THE CHECKOUT TAKES THE TRUNK TIP, NOT THE EVENT SHA (issue #1543). On a push event actions/checkout
# defaults to github.sha. This repo's ship-pr enqueues rather than folding, so the merge-then-local-fold
# race #1543 measured in a queueless consumer does not arise here -- but reading the pushed SHA still
# answers the wrong question ("did the trunk carry a leftover at commit S") when the one this job exists
# for is "does the trunk carry a leftover NOW". ref: main answers that and keeps this file in step with
# the adopt-ci-floor.ps1 template.
#
# WHAT IT DOES NOT DO IS PUT THE FOLD'S TRUNK-GAP GUARD (#1405) OUT OF REACH, WHICH THIS FILE CLAIMED
# UNTIL #1586. ref: main is read once, at the checkout; the guard measures the same trunk again about
# eleven seconds later, from inside the fold. Measured, run 34206684361 on 2026-09-08: the checkout took
# e8ca4cb7 (`merge: ... (#1576)`) at 08:50:31, so the leftover was genuinely there and correctly found --
# and by 08:50:42 the shipping session had pushed that branch's own fold, leaving this checkout 1 behind
# and the guard refusing on an entry already folded. The guard was right, and the trunk ended correct.
#
# SO THIS JOB STANDS DOWN ON THAT REFUSAL RATHER THAN GOING RED, and the argument is #1543's own,
# one step further along: this job exists to answer "does the trunk carry a leftover NOW", and a trunk
# that moved under it has changed what "now" means. The push that moved it is itself a push to main, so
# it has its own run of this workflow queued behind this one (cancel-in-progress: false, constant group),
# whose checkout is at-or-after that push -- and where cancellation drops a pending run, the run that
# SURVIVES is the newest, which reads the tip. Nothing is lost, because the guard fires in a pre-pass
# before a single entry is folded: the fold script signals it with exit code 2 and nothing else does.
#
# FETCH + --ff-only BEFORE THE FOLD WAS THE OTHER CANDIDATE AND WAS DECLINED. It would shrink the window
# from ~11s to ~1s without closing it, which leaves this job red RARELY -- worse than predictably red,
# and still the fourth self-healing meaning the three modes below exist to keep out.
#
# THE RACE HAS TWO SIDES, AND THE ~1s THAT SURVIVES ABOVE IS THE OTHER ONE (issue #1796). Everything
# down to here is the WIDE half: the other fold landed before this job's pre-pass read the trunk, so the
# guard refuses having written nothing (exit 2). Reaching the NARROW half needs the other fold to land
# inside the window between that read and this job's own push -- and then the pre-pass passes, entries
# are folded, a commit is made, and the push comes back refused as a non-fast-forward. No check at the
# top of a run can close a window that opens after it, which is why declining the --ff-only shrink above
# did not decide this and a second code was needed rather than a better pre-pass.
#
# THIS JOB STANDS DOWN ON THAT ONE TOO (exit 3), AND ITS GROUND IS DIFFERENT FROM #1586'S -- worth
# stating, because reusing #1586's reasoning here would be wrong twice over. That argument is "nothing
# was written, and a successor run is already queued to answer the question". Neither holds here: a
# commit WAS made, and no successor is owed anything, because the trunk is ALREADY correct. The ground
# is simpler and stronger -- the fold script proves every entry it folded is upstream already, present
# with an identical body, which is the only outcome this job exists to bring about. The redundant
# commit is real, and it is real in an EPHEMERAL WORKSPACE: unlike the session's side of the same race
# (#1792), where it lands on a trunk somebody has to live with, here it dies with the runner and there
# is nothing left to clean up.
#
# THE CODE ITSELF IS #1792'S, AND THAT IS WHY IT IS TRUSTWORTHY HERE. Both sides of this race were found
# and repaired within hours of each other -- #1792 from the session's side, this from the runner's -- and
# both reached for the same third code independently, on the same measurement, before either knew of the
# other. So exit 3 is not a signal invented for this file's convenience: it is the fold script's own
# verdict, defined and asserted where the fold lives, with two callers that read it and answer it
# differently. Read its EXIT CODES block before adding a third reader.
#
# NO CONCURRENCY CANCELLATION, AND A CONSTANT GROUP (issue #1544), unlike unfolded-entry.yml's read-only
# report -- that one can let a later run supersede an earlier one, because both report the same fact.
# This one WRITES and pushes to main: cancel-in-progress: false so no fold is dropped (the silent skip
# #1493 exists to close), AND a group keyed on github.ref rather than github.sha so two trunk pushes
# close together QUEUE instead of racing for the trunk -- a per-SHA group is its own group every run and
# serialises nothing. Two folds that still overlap are handled by fold-changelog-entry.ps1's own
# push-failure diagnosis, which tells them apart rather than corrupting anything.
#
# WINDOWS, like every other workflow that runs these scripts: they target Windows PowerShell 5.1, so
# this runs under `shell: powershell` (5.1) rather than pwsh.
name: Fold on merge

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]

concurrency:
  group: fold-on-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fold-on-merge:
    runs-on: windows-latest
    steps:
      # token here, not the default GITHUB_TOKEN: this is what makes the fold step's later `git push`
      # authenticate as the org-owner identity behind FOLD_PUSH_TOKEN rather than as the GitHub Actions
      # app -- see the header comment above for why the app itself cannot be a ruleset bypass actor.
      # Pinned to a commit SHA, matching claude.yml and claude-code-review.yml's own convention for a
      # checkout step that handles a real credential -- a mutable tag on this line could otherwise
      # retag its way into exfiltrating a 366-day standing write token instead of an hour-lived one.
      # ref: main, not the pushed SHA -- this job asks "does the trunk carry a leftover NOW", and a fold
      # already pushed on top of the merge commit must not read as still-unfolded here (issue #1543).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          token: ${{ secrets.FOLD_PUSH_TOKEN }}

      # continue-on-error is deliberate: check-unfolded-entry.ps1 exits non-zero on a genuine
      # find, which is the case this job exists to act on, not a step failure. BUT that leaves
      # a real crash in the detector (a git call misbehaving, an unhandled exception) exiting
      # non-zero too, indistinguishable from "found" at the process boundary -- and the fold
      # step below refuses to treat those the same, rather than folding blind on an outcome it
      # cannot explain (Victor #19, pre-merge review of this branch).
      - name: Is there an unfolded changelog entry on the trunk?
        id: check
        shell: powershell
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/lint/check-unfolded-entry.ps1 -Branch main *>&1 | Tee-Object -FilePath check-output.txt
          exit $LASTEXITCODE

      - name: Fold it (fold-all mode -- every leftover this push may carry)
        if: ${{ steps.check.outcome == 'failure' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The check step's own known-good signature (its [ERROR] line, verified against the
          # live script) is what tells "a leftover was found" apart from "the script crashed for
          # some other reason" -- both exit non-zero, and only one of them is safe to act on.
          $checkOutput = Get-Content check-output.txt -Raw
          if ($checkOutput -notmatch '\[ERROR\] the trunk carries') {
            Write-Error "check-unfolded-entry.ps1 exited non-zero for a reason other than a reported leftover -- refusing to fold blind. Its output:`n$checkOutput"
            exit 1
          }

          # This is commit-metadata identity only -- who authored the commit -- and is independent of
          # the push's actual credential (FOLD_PUSH_TOKEN, wired in by the checkout step above). A
          # ruleset bypass is checked against the pushing token's identity, not the commit author.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/fold-changelog-entry.ps1 -Commit -Push *>&1 | Tee-Object -FilePath fold-output.txt
          $foldExitCode = $LASTEXITCODE

          # EXIT 2 IS "THE TRUNK MOVED UNDER ME", AND THIS JOB STANDS DOWN ON IT (issue #1586). It is
          # the fold's trunk-freshness pre-pass, which runs before a single entry is folded -- so this
          # run has written nothing, and the push that made the checkout stale has its own run of this
          # workflow queued behind it, reading a tip that includes that push. Green, with the reason on
          # the log, rather than a red that describes a state gone by the time anybody opens it.
          #
          # KEYED ON THE CODE AND ONLY ON THAT CODE. Two prose matches already cross from these scripts'
          # stdout into this file; a third would put this agreement on a sentence that travels to
          # consumers by a plugin release while this file travels by adopt-ci-floor.ps1's template.
          # An exit code is checkable from both sides -- and every OTHER non-zero code still fails
          # below, which is the half that keeps this from becoming a blanket "ignore the fold".
          if ($foldExitCode -eq 2) {
            Write-Host "Stood down: the trunk moved between this job's checkout and the fold, so nothing was folded and nothing was written."
            Write-Host "  The push that moved it has its own run of this workflow, whose checkout includes it. See fold-on-merge.yml's header (#1586)."
            exit 0
          }

          # EXIT 3 IS "SOMEBODY ELSE FOLDED THIS WHILE I WAS FOLDING IT", AND THIS JOB STANDS DOWN ON IT
          # TOO (issue #1796). It is the narrow half of the same race exit 2 answers: 2 when the other
          # fold landed before this job read the trunk, 3 when it landed in the ~1s between that read and
          # this push. The fold script earns this code by MEASURING it -- every entry this run folded is
          # already upstream with an identical body -- not by the push having failed, so a GH013 ruleset
          # rejection (cause 3 in the header) still fails below, exactly as it always did.
          #
          # THE COMMIT THIS ONE LEAVES BEHIND IS WHY IT IS A SEPARATE CODE AND NOT MERGED INTO 2. A run
          # that ends here HAS committed, redundantly, in this runner's workspace -- which is thrown away
          # when the job ends, so there is nothing to clean up and no half-state for anybody to inherit.
          # ship-pr.ps1 stands down on the same code (issue #1792) and CANNOT stop there: its commit sits
          # on a real trunk, so its step 5c prints the commands to preserve and realign it. Two readers,
          # one code, and deliberately different answers -- the difference is whose trunk it is.
          if ($foldExitCode -eq 3) {
            Write-Host "Stood down: the fold's push lost the race, and every entry it carried is already on the trunk with an identical body -- so the trunk holds what this job exists to put there."
            Write-Host "  The redundant commit is local to this runner's workspace and dies with it. See fold-on-merge.yml's header (#1796)."
            exit 0
          }

          # The two scripts read the same trunk a moment apart and must agree: the check found a
          # leftover, so fold-all mode reporting nothing to fold is a real disagreement between
          # them, not a race worth swallowing -- fail loudly rather than report the job green on
          # a fold that fixed nothing.
          $foldOutput = Get-Content fold-output.txt -Raw
          if ($foldOutput -match 'No entry files found to fold') {
            Write-Error "check-unfolded-entry.ps1 reported a leftover but fold-changelog-entry.ps1 found nothing to fold -- the two disagree, which should not happen. Its output:`n$foldOutput"
            exit 1
          }
          exit $foldExitCode
